<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컬러 슬라이딩 퍼즐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Share+Tech+Mono&display=swap');
        body { font-family: 'Fredoka', sans-serif; background-color: #374151; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .device-frame { background-color: #EFEBE0; box-shadow: inset 0 4px 10px rgba(255,255,255,0.8), inset 0 -4px 10px rgba(0,0,0,0.1), 0 20px 40px rgba(0,0,0,0.4); }
        .tile-3d { transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.1s; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.4), 0 4px 6px rgba(0,0,0,0.3); border: 1px solid rgba(0,0,0,0.1); }
        .tile-3d:active { transform: translateY(2px) scale(0.98); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.4), 0 2px 3px rgba(0,0,0,0.3); }
        .screen-glow { box-shadow: inset 0 0 15px rgba(0,0,0,0.8); background-color: #1a1a1a; }
        .digital-font { font-family: 'Share Tech Mono', monospace; text-shadow: 0 0 5px rgba(74, 222, 128, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes successFlash { 0%, 100% { background-color: #EFEBE0; } 50% { background-color: #A7F3D0; } }
        .win-animation { animation: successFlash 1s ease-in-out 3; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen select-none overflow-hidden text-gray-800 relative">

    <div id="device" class="device-frame rounded-[2.5rem] p-5 w-full max-w-[380px] mx-4 relative border-4 border-[#dcd8cc]">
        <div class="flex justify-between items-start mb-6 gap-3">
            <div class="screen-glow p-3 rounded-2xl border-4 border-gray-800 w-28 h-28 flex flex-col justify-between shrink-0">
                <div id="target-grid" class="grid grid-cols-3 gap-1 h-full w-full"></div>
            </div>
            <div class="flex flex-col items-end gap-3 pt-1 w-full">
                <div class="flex gap-1.5">
                    <button id="btn-rank" class="w-9 h-9 rounded-full bg-[#dcd8cc] flex items-center justify-center text-gray-600 shadow-[inset_0_-3px_0_rgba(0,0,0,0.1),0_2px_4px_rgba(0,0,0,0.2)] active:translate-y-[2px]">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                    </button>
                    <button id="btn-haptic" class="w-9 h-9 rounded-full bg-[#dcd8cc] flex items-center justify-center text-gray-600 shadow-[inset_0_-3px_0_rgba(0,0,0,0.1),0_2px_4px_rgba(0,0,0,0.2)] active:translate-y-[2px]">
                        <svg id="icon-haptic-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01M2 8v8M22 8v8"></path></svg>
                        <svg id="icon-haptic-off" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><line x1="2" y1="2" x2="22" y2="22"></line></svg>
                    </button>
                    <button id="btn-sound" class="w-9 h-9 rounded-full bg-[#dcd8cc] flex items-center justify-center text-gray-600 shadow-[inset_0_-3px_0_rgba(0,0,0,0.1),0_2px_4px_rgba(0,0,0,0.2)] active:translate-y-[2px]">
                        <svg id="icon-sound-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        <svg id="icon-sound-off" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                    </button>
                    <button id="btn-reset" class="w-9 h-9 rounded-full bg-[#dcd8cc] flex items-center justify-center text-gray-600 shadow-[inset_0_-3px_0_rgba(0,0,0,0.1),0_2px_4px_rgba(0,0,0,0.2)] active:translate-y-[2px]">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16M16 16h5v5"/></svg>
                    </button>
                </div>
                <div class="w-full bg-[#111827] rounded-xl border-4 border-gray-700 shadow-[inset_0_2px_10px_rgba(0,0,0,0.8)] p-2 mt-1">
                    <div id="timer-display" class="digital-font text-green-400 text-2xl text-center tracking-widest">00:00.00</div>
                </div>
            </div>
        </div>
        <div class="bg-[#dcd8cc] p-2 rounded-2xl shadow-[inset_0_4px_8px_rgba(0,0,0,0.1)]">
            <div id="main-grid" class="grid grid-cols-3 gap-2 w-full aspect-square relative"></div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-message" class="fixed inset-0 z-40 hidden flex-col items-center justify-center bg-black/60 backdrop-blur-sm px-4">
        <div class="bg-white p-6 rounded-[2rem] shadow-2xl text-center w-full max-w-sm" id="win-modal">
            <h2 class="text-3xl font-bold text-green-500 mb-1">SUCCESS!</h2>
            <div class="bg-gray-100 rounded-xl p-4 mb-4">
                <div id="final-time" class="digital-font text-3xl text-gray-800">00:00.00</div>
            </div>
            <div class="flex flex-col gap-2">
                <button id="btn-save-score" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow-[0_4px_0_#166534] active:translate-y-[4px] active:shadow-none">기록 저장하기</button>
                <button id="btn-next" class="w-full bg-gray-300 text-gray-700 font-bold py-3 rounded-xl">다시하기</button>
            </div>
        </div>
    </div>

    <!-- Ranking Modal -->
    <div id="ranking-overlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-black/60 backdrop-blur-sm px-4">
        <div class="bg-[#EFEBE0] rounded-[2rem] w-full max-w-sm flex flex-col overflow-hidden shadow-2xl h-[70vh]">
            <div class="bg-gray-800 text-white p-4 flex justify-between items-center relative">
                <h2 class="text-xl font-bold w-full text-center">🏆 나의 최고 기록</h2>
                <button id="btn-close-ranking" class="absolute right-4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <div class="flex-1 overflow-y-auto no-scrollbar p-4 bg-gray-50" id="ranking-list"></div>
            <div class="p-4 bg-gray-100 border-t">
                <button id="btn-clear-local" class="w-full py-2 text-xs text-red-500 font-bold uppercase tracking-wider">기록 전체 삭제</button>
            </div>
        </div>
    </div>

    <script>
        // === 게임 상태 및 설정 ===
        let board = [], target = [];
        let gameWon = false, startTime = 0, elapsedMs = 0, timerInterval = null, finalTimeMs = 0;
        let isAudioEnabled = true, isHapticEnabled = true, audioCtx = null;
        const COLORS = { 1: '#f48fb1', 2: '#4caf50', 3: '#2196f3', 4: '#4dd0e1', 5: '#ffeb3b', 6: '#f44336', 7: '#9c27b0', 8: '#ff9800', 0: 'transparent' };

        // === 1. 사운드 및 햅틱 엔진 ===
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!isAudioEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'square';
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(f, now + i * 0.1);
                    g.gain.setValueAtTime(0.05, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.3);
                });
            }
        }

        function triggerHaptic(type) {
            if (!isHapticEnabled || !navigator.vibrate) return;
            if (type === 'move') navigator.vibrate(10);
            else if (type === 'win') navigator.vibrate([50, 30, 50, 30, 100]);
        }

        // === 2. 로컬 저장소 로직 ===
        const STORAGE_KEY = 'sliding_puzzle_scores';

        function getLocalScores() {
            const scores = localStorage.getItem(STORAGE_KEY);
            return scores ? JSON.parse(scores) : [];
        }

        function saveLocalScore(ms) {
            let scores = getLocalScores();
            const newRecord = { time: ms, date: new Date().toLocaleString() };
            scores.push(newRecord);
            scores.sort((a, b) => a.time - b.time);
            scores = scores.slice(0, 10);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
        }

        function clearLocalScores() {
            if(confirm("모든 기록을 삭제하시겠습니까?")) {
                localStorage.removeItem(STORAGE_KEY);
                renderRankingUI();
            }
        }

        // === 3. UI 및 게임 로직 ===
        function formatTime(ms) {
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const cs = Math.floor((ms % 1000) / 10);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;
        }

        function generatePuzzle() {
            gameWon = false;
            elapsedMs = 0;
            document.getElementById('timer-display').textContent = "00:00.00";
            document.getElementById('win-message').classList.add('hidden');
            document.getElementById('device').classList.remove('win-animation');
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

            let base = [1, 2, 3, 4, 5, 6, 7, 8, 0];
            target = [...base].sort(() => Math.random() - 0.5);
            board = [...target];

            for(let i=0; i<100; i++) {
                const zero = board.indexOf(0);
                const adj = [];
                if (zero % 3 > 0) adj.push(zero - 1);
                if (zero % 3 < 2) adj.push(zero + 1);
                if (zero >= 3) adj.push(zero - 3);
                if (zero <= 5) adj.push(zero + 3);
                const move = adj[Math.floor(Math.random() * adj.length)];
                [board[zero], board[move]] = [board[move], board[zero]];
            }

            renderTarget();
            renderBoard();
        }

        function renderTarget() {
            const grid = document.getElementById('target-grid');
            grid.innerHTML = '';
            target.forEach(v => {
                const d = document.createElement('div');
                d.className = 'w-full h-full rounded-sm';
                d.style.backgroundColor = v === 0 ? '#111' : COLORS[v];
                grid.appendChild(d);
            });
        }

        function renderBoard() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            board.forEach((v, i) => {
                const d = document.createElement('div');
                if (v !== 0) {
                    d.className = 'tile-3d rounded-xl w-full h-full flex items-center justify-center cursor-pointer';
                    d.style.backgroundColor = COLORS[v];
                    d.onclick = () => moveTile(i);
                }
                grid.appendChild(d);
            });
        }

        function moveTile(idx) {
            if (gameWon) return;
            initAudio(); // 최초 클릭 시 오디오 컨텍스트 활성화

            if (!timerInterval) {
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    elapsedMs = Date.now() - startTime;
                    document.getElementById('timer-display').textContent = formatTime(elapsedMs);
                }, 50);
            }

            const zero = board.indexOf(0);
            const r = Math.floor(idx / 3), c = idx % 3;
            const zr = Math.floor(zero / 3), zc = zero % 3;

            if (Math.abs(r - zr) + Math.abs(c - zc) === 1) {
                [board[idx], board[zero]] = [board[zero], board[idx]];
                playSound('move');
                triggerHaptic('move');
                renderBoard();
                if (board.every((v, i) => v === target[i])) win();
            }
        }

        function win() {
            gameWon = true;
            clearInterval(timerInterval);
            timerInterval = null;
            finalTimeMs = elapsedMs;
            playSound('win');
            triggerHaptic('win');
            document.getElementById('final-time').textContent = formatTime(finalTimeMs);
            document.getElementById('win-message').classList.remove('hidden');
            document.getElementById('device').classList.add('win-animation');
        }

        function renderRankingUI() {
            const container = document.getElementById('ranking-list');
            const scores = getLocalScores();
            if (scores.length === 0) {
                container.innerHTML = '<p class="text-center py-10 text-gray-400 text-sm">아직 저장된 기록이 없습니다.<br>게임을 클리어하고 기록을 남겨보세요!</p>';
                return;
            }
            container.innerHTML = scores.map((s, i) => `
                <div class="flex justify-between items-center p-3 bg-white mb-2 rounded-xl shadow-sm border border-gray-100">
                    <div>
                        <span class="text-xs font-bold text-gray-400 mr-2">${i+1}</span>
                        <span class="digital-font text-xl text-green-600">${formatTime(s.time)}</span>
                    </div>
                    <span class="text-[10px] text-gray-400">${s.date.split(',')[0]}</span>
                </div>
            `).join('');
        }

        // === 4. 이벤트 리스너 ===
        document.getElementById('btn-save-score').onclick = () => {
            saveLocalScore(finalTimeMs);
            document.getElementById('win-message').classList.add('hidden');
            renderRankingUI();
            document.getElementById('ranking-overlay').classList.remove('hidden');
        };

        document.getElementById('btn-reset').onclick = generatePuzzle;
        document.getElementById('btn-rank').onclick = () => {
            renderRankingUI();
            document.getElementById('ranking-overlay').classList.remove('hidden');
        };
        document.getElementById('btn-close-ranking').onclick = () => document.getElementById('ranking-overlay').classList.add('hidden');
        document.getElementById('btn-next').onclick = generatePuzzle;
        document.getElementById('btn-clear-local').onclick = clearLocalScores;

        // 사운드 토글
        document.getElementById('btn-sound').onclick = () => {
            isAudioEnabled = !isAudioEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !isAudioEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', isAudioEnabled);
            initAudio();
        };

        // 햅틱 토글
        document.getElementById('btn-haptic').onclick = () => {
            isHapticEnabled = !isHapticEnabled;
            document.getElementById('icon-haptic-on').classList.toggle('hidden', !isHapticEnabled);
            document.getElementById('icon-haptic-off').classList.toggle('hidden', isHapticEnabled);
        };

        // 초기화
        generatePuzzle();
    </script>
</body>
</html>
